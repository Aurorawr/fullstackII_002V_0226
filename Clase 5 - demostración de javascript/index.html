<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>Sumador</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
        <h1 class="text-center mt-4">Sumador de números</h1>

        <div class="container mt-4">
            <div class="row">
                <div class="col-12 col-md-5 mt-2 mt-md-0">
                    <input id="input-numero1" class="form-control numero-suma" type="number">
                </div>
                <div class="col-12 col-md-5 mt-2 mt-md-0">
                    <input id="input-numero2" class="form-control numero-suma" type="number">
                </div>
                <div class="col-12 col-md-2 text-center mt-2 mt-md-0">
                    <button id="boton-suma" class="btn btn-primary">Sumar</button>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
