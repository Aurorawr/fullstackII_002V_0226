<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>Formulario de contacto</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <header>
            <div id="contenedor-nombre">
                <h1 id="nombre-empresa">Mercado Libre</h1>
            </div>
            <div id="contenedor-buscador">
                <input type="text" placeholder="Buscar..." />
            </div>
            <nav>
                <ul>
                    <li>Inicio</li>
                    <li>Contacto</li>
                </ul>
            </nav>
        </header>
        <main>
            <h1>Formulario de contacto</h1>
            <div>
                <label>Nombre:</label>
                <input class="input-formulario" type="text" placeholder="Ingrese su nombre" />
            </div>
            <div>
                <label>Correo:</label>
                <input class="input-formulario" type="email" placeholder="Ingrese su correo" />
            </div>
            <div>
                <label>Mensaje:</label>
                <textarea class="input-formulario"></textarea>
            </div>
            <div>
                <button>Enviar</button>
            </div>
        </main>
        <footer>
            <h4>Mercado Libre - Todos los derechos reservados - 2026</h4>
        </footer>
    </body>
</html>
